<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pablo Henrique Oliveira · sobre mim</title>
  <meta name="description" content="Fullstack em transição, com background em ciência de dados. Projetos de backend, automação e dados.">
  <meta name="theme-color" content="#0b0f14">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://pablohodev.github.io/PabloHoDev/">
  <meta property="og:title" content="Pablo Henrique Oliveira">
  <meta property="og:description" content="Fullstack em transição · background em ciência de dados. Veja meus projetos.">
  <meta property="og:image" content="https://pablohodev.github.io/PabloHoDev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Terminal com o nome Pablo Henrique Oliveira e a lista de projetos.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <style>
    :root {
      --bg: #0b0f14;
      --panel: #0f1419;
      --line: #263241;
      --text: #e6edf3;
      --muted: #9aa7b4;
      --dim: #6e7681;
      --accent: #3ddbb5;
      --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 720px; }

    .terminal {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .bar {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 13px;
    }
    .screen { padding: 20px 18px 22px; font-size: 15px; line-height: 1.5; }
    .screen p { margin: 0; }
    .cmd { margin-top: 18px !important; white-space: nowrap; }
    .cmd:first-child { margin-top: 0 !important; }
    .prompt { color: var(--accent); }
    .out { color: var(--muted); }
    h1 {
      margin: 2px 0 0;
      font-size: clamp(20px, 5.5vw, 26px);
      line-height: 1.25;
    }

    .projects { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
    .projects a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .projects a:hover, .projects a:focus-visible { color: var(--accent); text-decoration-color: var(--accent); }

    .cursor {
      display: inline-block;
      width: .6em; height: 1.1em;
      background: var(--accent);
      vertical-align: text-bottom;
      margin-left: .4em;
    }

    nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    nav a {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
    }
    nav a span { color: var(--accent); }
    nav a:hover, nav a:focus-visible { border-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    footer { margin-top: 14px; color: var(--dim); font-size: 12px; text-align: center; }

    /* Animação: digita os comandos e mostra as respostas, uma única vez. */
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    .c1 { animation: type .7s steps(10) .3s both; }
    .o1 { animation: show .01s 1.2s both; }
    .c2 { animation: type .8s steps(16) 1.7s both; }
    .o2 { animation: show .01s 2.7s both; }
    .c3 { animation: type .8s steps(16) 3.2s both; }
    .o3 { animation: show .01s 4.2s both; }
    .c4 { animation: show .01s 4.7s both; }
    .cursor { animation: blink 1.1s steps(1) 4.7s infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="terminal" aria-label="Apresentação">
      <div class="bar" aria-hidden="true">pablo@dev: ~</div>
      <div class="screen">
        <p class="cmd c1" aria-hidden="true"><span class="prompt">~ $</span> whoami</p>
        <h1 class="o1">Pablo Henrique Oliveira</h1>

        <p class="cmd c2" aria-hidden="true"><span class="prompt">~ $</span> cat foco.txt</p>
        <p class="out o2">fullstack em transição · background em ciência de dados</p>

        <p class="cmd c3" aria-hidden="true"><span class="prompt">~ $</span> ls projetos/</p>
        <ul class="projects o3" aria-label="Projetos">
          <li><a href="https://github.com/PabloHoDev/pending-reconciliation">pending-reconciliation</a></li>
          <li><a href="https://github.com/PabloHoDev/crowslot-saas">crowslot</a></li>
          <li><a href="https://github.com/PabloHoDev/enterprise-workflow-engine">workflow-engine</a></li>
          <li><a href="https://github.com/PabloHoDev/excel-sync-tool">excel-sync-tool</a></li>
        </ul>

        <p class="cmd c4" aria-hidden="true"><span class="prompt">~ $</span><span class="cursor"></span></p>
      </div>
    </section>

    <nav aria-label="Contato">
      <a href="https://www.linkedin.com/in/pablo-henrique-oliveira-7a4610227/"><span>→</span> LinkedIn</a>
      <a href="https://github.com/PabloHoDev"><span>→</span> GitHub</a>
    </nav>

    <footer>cada projeto abre o repositório no GitHub</footer>
  </main>
</body>
</html>
