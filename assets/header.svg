<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" role="img" aria-labelledby="title desc">
  <title id="title">Pablo Henrique Oliveira</title>
  <desc id="desc">Terminal: whoami mostra Pablo Henrique Oliveira; o foco é backend, automação e dados; projetos em andamento: pending-reconciliation, crowslot, workflow-engine e excel-sync-tool.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Liberation Mono", monospace; font-size: 16px; }
    .prompt { fill: #3ddbb5; }
    .cmd { fill: #e6edf3; }
    .out { fill: #9aa7b4; }
    .name { fill: #ffffff; font-size: 24px; font-weight: 700; }
    .tab { fill: #6e7681; font-size: 13px; }

    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }

    .c1 { animation: type .7s steps(7) .3s both; }
    .o1 { animation: show .01s 1.2s both; }
    .c2 { animation: type .8s steps(13) 1.7s both; }
    .o2 { animation: show .01s 2.7s both; }
    .c3 { animation: type .8s steps(13) 3.2s both; }
    .o3 { animation: show .01s 4.2s both; }
    .c4 { animation: show .01s 4.7s both; }
    .cursor { animation: show .01s 4.7s both, blink 1.1s steps(1) 4.7s infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect x="0.5" y="0.5" width="859" height="289" rx="10" fill="#0f1419" stroke="#263241"/>
  <path d="M0.5 36 H859.5" stroke="#263241"/>
  <text x="20" y="23" class="mono tab">pablo@dev: ~</text>

  <g class="mono">
    <text x="24" y="72" class="c1"><tspan class="prompt">~ $</tspan><tspan class="cmd"> whoami</tspan></text>
    <text x="24" y="104" class="name o1">Pablo Henrique Oliveira</text>

    <text x="24" y="142" class="c2"><tspan class="prompt">~ $</tspan><tspan class="cmd"> cat foco.txt</tspan></text>
    <text x="24" y="168" class="out o2">backend · automação · dados</text>

    <text x="24" y="206" class="c3"><tspan class="prompt">~ $</tspan><tspan class="cmd"> ls projetos/</tspan></text>
    <text x="24" y="232" class="out o3">pending-reconciliation  crowslot  workflow-engine  excel-sync-tool</text>

    <text x="24" y="268" class="c4"><tspan class="prompt">~ $</tspan></text>
    <rect x="66" y="254" width="10" height="18" fill="#3ddbb5" class="cursor"/>
  </g>
</svg>
